name: CI
on:
  push:
    branches:
      - master
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.julia-threads }} thread(s) - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    env:
      JULIA_NUM_THREADS: ${{ matrix.julia-threads }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'lts'
          - '1'
          - 'pre'
          - 'nightly'
        arch:
          - x64
        julia-threads:
          - '1'

        os: [ubuntu-latest, windows-latest, macOS-latest]

        include:
          - os: ubuntu-latest
            version: '1'
            arch: x64
            julia-threads: '2'

    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - run: python --version
      - name: windows
        if: runner.os == 'Windows'
        run: JULIA_CONDAPKG_EXE="${CONDA}\_conda.exe" julia --project -e 'using Pkg; Pkg.test(; coverage=true)'
      - name: macos
        if: runner.os == 'macOS'
        run: julia --project -e 'using Pkg; Pkg.test(; coverage=true)'
      - name: linux
        if: runner.os == 'Linux'
        run: JULIA_CONDAPKG_EXE=$CONDA/bin/conda julia --project -e 'using Pkg; Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@latest
      - uses: codecov/codecov-action@v5
        with:
          file: lcov.info

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd()));
                                               Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
